clean_segment:
  name: Clean room(s)
  description: Start cleaning one or more rooms by their map room id.
  target:
    entity:
      domain: vacuum
      integration: xiaomi_vac
  fields:
    segments:
      name: Rooms
      description: List of room ids to clean (from the map camera's "rooms" attribute).
      required: true
      example: "[11, 12]"
      selector:
        object:

refresh_map:
  name: Refresh map
  description: Briefly starts the vacuum so it leaves the dock and uploads a fresh map, then sends it back to dock.
  target:
    entity:
      domain: vacuum
      integration: xiaomi_vac
  fields:
    confirm_movement:
      name: Confirm movement
      description: Must be true. The vacuum will briefly leave the dock and return.
      required: true
      example: true
      selector:
        boolean:

get_room_preferences:
  name: Get room preferences
  description: >-
    Read current per-room cleaning settings (mode, fan power, water level,
    twice-clean, carpet-boost, enabled) for the active map. Returns
    {"preferences": [...]}.
  target:
    entity:
      domain: vacuum
      integration: xiaomi_vac
  fields:
    map_id:
      name: Map id
      description: Map to read preferences for. Defaults to the currently active map.
      required: false
      example: 1769694283
      selector:
        number:
          mode: box

set_room_preferences:
  name: Set room preferences
  description: >-
    RAW write of per-room cleaning settings for the active map: sends
    exactly what you give it and nothing more. Each entry needs at least
    room_id. If you omit a room here, its saved settings may be reset —
    use apply_room_preferences instead unless you're intentionally
    providing the complete list for every room.
  target:
    entity:
      domain: vacuum
      integration: xiaomi_vac
  fields:
    preferences:
      name: Preferences
      description: List of room preference objects.
      required: true
      example: >-
        [{"room_id": 16, "clean_mode": 0, "wind_power": 2, "water_level": 2, "choose": 1}]
      selector:
        object:
    map_id:
      name: Map id
      description: Map to write preferences for. Defaults to the currently active map.
      required: false
      example: 1769694283
      selector:
        number:
          mode: box

apply_room_preferences:
  name: Apply room preferences (safe)
  description: >-
    Fetches current per-room settings first, then overrides only the rooms
    and fields you specify — every room you don't mention keeps its saved
    settings and is simply marked inactive for the next clean. Use this
    instead of set_room_preferences unless you're intentionally replacing
    every room's settings in one call. clean_mode (0 Sweep, 1 Sweep+Mop,
    2 Mop, 3 Sweep then Mop), wind_power (0 Silent, 1 Basic, 2 Strong,
    3 Full Speed), water_level (0-3), twice_clean (0/1), carpet (0 not set,
    1 auto-boost, 2 off) fall back to the room's current saved value if
    omitted, not a hardcoded default.
  target:
    entity:
      domain: vacuum
      integration: xiaomi_vac
  fields:
    active_rooms:
      name: Active rooms
      description: List of room objects to activate; every other known room is deactivated.
      required: true
      example: >-
        [{"room_id": 14}, {"room_id": 16, "water_level": 3}]
      selector:
        object:
    map_id:
      name: Map id
      description: Map to apply preferences for. Defaults to the currently active map.
      required: false
      example: 1769694283
      selector:
        number:
          mode: box

resume_or_start:
  name: Resume or start
  description: >-
    Continues whatever room-clean job is currently marked active on the
    device (read live from the vacuum/cloud, not from any client-side
    memory), or starts a plain full-home clean if nothing is currently
    chosen. Use this instead of the plain vacuum.start action for a
    "start/resume" button, since vacuum.start always begins a fresh
    full-home clean and can never continue a specific room-clean job.
  target:
    entity:
      domain: vacuum
      integration: xiaomi_vac
  fields:
    map_id:
      name: Map id
      description: Map to check for chosen rooms. Defaults to the currently active map.
      required: false
      example: 1769694283
      selector:
        number:
          mode: box
